name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Web & Native
        run: pnpm --filter @musike/web typecheck

      - name: Decode Release Keystore (Optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.MUSIKE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No release keystore secret set — signing with Android debug keystore so the APK remains directly installable."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/amusic-release.jks"
          echo "MUSIKE_KEYSTORE=$RUNNER_TEMP/amusic-release.jks" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: pnpm --filter @musike/mobile apk
        env:
          MUSIKE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.MUSIKE_KEYSTORE_PASSWORD }}
          MUSIKE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.MUSIKE_KEY_ALIAS }}
          MUSIKE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.MUSIKE_KEY_PASSWORD }}

      - name: Clean Up Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/amusic-release.jks"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a-music-android-apk
          path: release/A-Music-Android.apk
          retention-days: 7
          if-no-files-found: error
        continue-on-error: true

      - name: Release APK to GitHub Releases (Single Latest Release)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "A Music (Latest Build)"
          body: |
            ### 🎵 A Music — Build Terbaru (Build #${{ github.run_number }})
            - **Kompatibilitas:** Android Mobile & Android TV / STB (Min Android 7.0 / API 24)
            - **Commit:** `${{ github.sha }}`
            - **File:** `A-Music-Android.apk` (kompilasi otomatis terbaru dari branch utama)
          draft: false
          prerelease: false
          files: |
            release/A-Music-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
